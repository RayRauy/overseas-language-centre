server:
  port: 9000
spring:
  application:
    name: overseas-language-centre

  datasource:
    url: jdbc:postgresql://localhost:5432/overseas-language-center
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: db/changelog/db.changelog-master.yaml
    enabled: true
jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes-please}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}