databaseChangeLog:
  - changeSet:
      id: 0017-add-back-not-unique
      author: jpa
      changes:
        - createTable:
            tableName: otp_not_unique
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_otp_user
                    references: users(id)
              - column:
                  name: otp_encrypted
                  type: VARCHAR(512)
              - column:
                  name: expires_at
                  type: TIMESTAMP
              - column:
                  name: sent_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: last_sent_at
                  type: TIMESTAMP
              - column:
                  name: verified
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
