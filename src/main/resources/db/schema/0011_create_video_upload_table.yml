databaseChangeLog:
  - changeSet:
      id: create-video-upload-table
      author: Hout
      changes:
        - createTable:
            tableName: video_upload
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: upload_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: minio_upload_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: object_key
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: file_name
                  type: VARCHAR(255)

              - column:
                  name: content_type
                  type: VARCHAR(100)

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: INITIATED
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false